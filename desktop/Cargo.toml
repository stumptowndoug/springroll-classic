[package]
name = "springroll-desktop"
version = "0.1.5"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
fs2 = "0.4"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
sha2 = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"
